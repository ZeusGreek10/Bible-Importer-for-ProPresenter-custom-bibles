name: Build the Bible Importer app

# Runs only when you press "Run workflow" (Actions tab); it no longer starts by itself on every push.
# (This file replaces the old one that built the command-line tool on every push; see git history.)
# Pick what to build (it builds BOTH unless you choose one):
#   all     the Mac disk image (.dmg) and the Windows zip
#   mac     only the Mac disk image (.dmg)
#   windows only the zip with the Windows app
# Tests run first on Linux (cheap); the apps are built only if they pass.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'What to build'
        type: choice
        default: all
        options: [all, mac, windows]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-gui.txt -r requirements.txt pytest
      - name: Tests
        run: python -m pytest -q tests -W ignore
        env:
          QT_QPA_PLATFORM: offscreen

  mac:
    needs: test
    if: ${{ inputs.only == 'mac' || inputs.only == 'all' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pyinstaller

      # One app for Intel and Apple-chip Macs needs "universal2" copies of every library. pip normally picks the
      # Apple-chip-only copy, which makes PyInstaller stop ("is not a fat binary"), so ask for universal2 ones.
      - name: Build the app (Intel + Apple chips)
        id: universal
        continue-on-error: true
        run: |
          pip install --target universal-deps --only-binary=:all: --implementation cp --python-version 3.10 --abi cp310 \
            --platform macosx_10_9_universal2 --platform macosx_11_0_universal2 --platform macosx_12_0_universal2 \
            -r requirements-gui-app.txt
          PYTHONPATH=universal-deps pyinstaller bible_gui.spec
      - name: Build the app for this Mac's chip only (if the universal build did not work)
        if: steps.universal.outcome == 'failure'
        run: |
          rm -rf build dist
          pip install -r requirements-gui-app.txt
          BI_ARCH=native pyinstaller bible_gui.spec

      - name: Which chips does the app run on?
        run: |
          ARCHS=$(lipo -archs "dist/Bible Importer.app/Contents/MacOS/BibleImporter")
          echo "Chips: $ARCHS"
          echo "### Mac app chips: $ARCHS" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.universal.outcome }}" = "failure" ]; then
            echo "The universal build failed, so this app is for this Mac's chip only (Apple Silicon)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check the built app starts
        run: "dist/Bible\\ Importer.app/Contents/MacOS/BibleImporter --self-test"
        env:
          QT_QPA_PLATFORM: offscreen
          BIBLE_IMPORTER_DATA: ${{ runner.temp }}/bible-importer-check

      - name: Make the disk image
        run: |
          mkdir dmg
          cp -R "dist/Bible Importer.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Bible Importer" -srcfolder dmg -ov -format UDZO BibleImporter-Mac.dmg
          ls -la BibleImporter-Mac.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: BibleImporter-Mac-dmg
          path: BibleImporter-Mac.dmg
          compression-level: 0

  windows:
    needs: test
    if: ${{ inputs.only == 'windows' || inputs.only == 'all' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements-gui.txt
      - run: pyinstaller bible_gui.spec

      - name: Check the built app starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\BibleImporter\BibleImporter.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The built app did not start (exit code $($p.ExitCode))" }
        env:
          QT_QPA_PLATFORM: offscreen
          BIBLE_IMPORTER_DATA: ${{ runner.temp }}\bible-importer-check

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\BibleImporter -DestinationPath BibleImporter-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BibleImporter-Windows
          path: BibleImporter-Windows.zip
          compression-level: 0
